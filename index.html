<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24時間スケジューラ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>24時間スケジューラ</h1>
    <p class="sub">1日を円グラフで見える化。上が0:00、時計回りに進みます。</p>
  </header>

  <main class="layout">
    <section class="chart-card" aria-label="24時間円グラフ">
      <svg id="chart" viewBox="0 0 440 440" role="img" aria-label="24時間のスケジュール円グラフ"></svg>
      <div class="summary">
        <div><span class="label">予定あり</span><strong id="sum-used">0時間</strong></div>
        <div><span class="label">空き時間</span><strong id="sum-free">24時間</strong></div>
      </div>
    </section>

    <section class="panel">
      <form id="event-form" autocomplete="off">
        <h2 id="form-title">予定を追加</h2>

        <label class="field">
          <span>予定名</span>
          <input id="f-title" type="text" maxlength="30" required placeholder="例: 仕事、睡眠、勉強">
        </label>

        <div class="row">
          <label class="field">
            <span>開始</span>
            <input id="f-start" type="time" required value="09:00">
          </label>
          <label class="field">
            <span>終了</span>
            <input id="f-end" type="time" required value="10:00">
          </label>
        </div>
        <p class="hint">終了が開始より前なら、日をまたぐ予定として扱います（例: 23:00 → 07:00）。</p>

        <div class="field">
          <span>色</span>
          <div class="color-row">
            <input id="f-color" type="color" value="#4f8ef7" aria-label="色を選ぶ">
            <div id="swatches" class="swatches"></div>
          </div>
        </div>

        <p id="form-error" class="error" role="alert" hidden></p>

        <div class="actions">
          <button type="submit" id="btn-submit" class="primary">追加</button>
          <button type="button" id="btn-cancel" hidden>編集をやめる</button>
        </div>
      </form>

      <h2>予定一覧</h2>
      <ul id="event-list" class="event-list"></ul>
      <p id="empty" class="hint" hidden>まだ予定がありません。</p>

      <div class="tools">
        <button type="button" id="btn-export">JSONで書き出し</button>
        <label class="file-btn">
          JSONを読み込み
          <input id="file-import" type="file" accept="application/json" hidden>
        </label>
        <button type="button" id="btn-sample">サンプルに戻す</button>
        <button type="button" id="btn-clear" class="danger">すべて削除</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
